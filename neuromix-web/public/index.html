<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeurOmix</title>
<meta name="description" content="Search 1,000+ ranked gene lists from neuroscience and neurodegeneration omics studies.">
<link rel="preload" href="/fonts/texgyreschola-regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/fonts/texgyrepagella-bold.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231f5fa8'/%3E%3Cpath d='M9 23V9l14 14V9' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/genes">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" fill="currentColor"/><path d="M9 23V9l14 14V9" stroke="var(--page, #fff)" stroke-width="3" fill="none"/></svg>
      </span>
      <span class="brand-text">
        <strong>NeurOmix</strong>
        <small>Ranked gene lists from neuro omics studies</small>
      </span>
    </a>

    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#/genes" data-route="genes">Gene analysis</a>
      <a href="#/lists" data-route="lists">Gene list analysis</a>
      <a href="#/studies" data-route="studies">Study browser</a>
      <a href="#/about" data-route="about">About</a>
    </nav>

    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <section class="view" id="view-genes" hidden></section>
  <section class="view" id="view-lists" hidden></section>
  <section class="view" id="view-studies" hidden></section>
  <section class="view" id="view-about" hidden></section>

  <div class="boot" id="boot">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading the NeurOmix database</p>
  </div>
</main>

<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <header class="drawer-head">
    <h2 id="drawer-title"></h2>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
